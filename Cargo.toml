[package]
name = "amazon_network_analysis"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Analysis of Amazon product co-purchasing network"

[dependencies]
petgraph = "0.6.3"
csv = "1.2.1"
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.94"
rayon = "1.7.0"
indicatif = "0.17.3"
rand = "0.8.5"
itertools = "0.10.5"
clap = { version = "4.2.0", features = ["derive"] }
log = "0.4.17"
env_logger = "0.10.0"
colored = "2.0.0"

